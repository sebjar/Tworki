<title>Tworki</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Uklad: pudelko z kartami przepisow; na telefonie zakladki na dole jak w aplikacji.
   Zielen z naglowkow arkusza Przepisy-planer, pomidorowa czerwien dla kalorii,
   liczby (gramy, kcal) pismem z wagi kuchennej. */
:root {
  --bg: #f2f4ef; --surface: #ffffff; --sunk: #e9ede6; --ink: #17201a; --muted: #5b685f; --line: #d6ddd3;
  --green: #2f5233; --green-ink: #ffffff; --green-soft: #e0eadd;
  --tomato: #b23c25; --tomato-soft: #fbe4dc; --amber: #85560f; --amber-soft: #f7ebcf;
  --veil: rgba(16, 24, 18, .5); --shadow: 0 1px 2px rgba(23, 32, 26, .06), 0 6px 18px rgba(23, 32, 26, .08);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 14px; --nav-h: 0px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1411; --surface: #172019; --sunk: #121915; --ink: #e5ebe6; --muted: #9ca99f; --line: #2a352d;
    --green: #8cc29a; --green-ink: #0c120e; --green-soft: #1e2d22;
    --tomato: #ff8a6b; --tomato-soft: #3a211a; --amber: #e7b85c; --amber-soft: #33290f;
    --veil: rgba(0, 0, 0, .6); --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 18px rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1411; --surface: #172019; --sunk: #121915; --ink: #e5ebe6; --muted: #9ca99f; --line: #2a352d;
  --green: #8cc29a; --green-ink: #0c120e; --green-soft: #1e2d22;
  --tomato: #ff8a6b; --tomato-soft: #3a211a; --amber: #e7b85c; --amber-soft: #33290f;
  --veil: rgba(0, 0, 0, .6); --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 18px rgba(0, 0, 0, .3); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .45; }
:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
svg { flex: none; }
.wrap { max-width: 1160px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }
.muted { color: var(--muted); }

/* naglowek i zakladki */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--bg); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 12px 20px; padding-block: 12px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { width: 30px; height: 30px; color: var(--green); }
.brand h1 { font-size: 21px; font-weight: 800; letter-spacing: -.02em; line-height: 1; }
.brand small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 3px; }
.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px; margin-left: auto; }
.tabs button { display: flex; align-items: center; gap: 7px; border: 0; background: none; padding: 7px 14px; border-radius: 999px; font-weight: 600; font-size: 14px; color: var(--muted); white-space: nowrap; }
.tabs button svg { width: 17px; height: 17px; }
.tabs button[aria-selected="true"] { background: var(--green); color: var(--green-ink); }
.tabs .cnt { font-family: var(--f-num); font-size: 11.5px; min-width: 18px; padding: 0 5px; border-radius: 99px; background: var(--tomato); color: #fff; line-height: 18px; text-align: center; }
.tabs .cnt:empty { display: none; }
@media (max-width: 680px) {
  :root { --nav-h: calc(64px + env(safe-area-inset-bottom, 0px)); }
  .tabs { position: fixed; z-index: 7; left: 0; right: 0; bottom: 0; margin: 0; border-radius: 0; border: 0; border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); background: var(--surface); }
  .tabs button { flex: 1; flex-direction: column; gap: 2px; font-size: 11.5px; padding: 6px 4px; border-radius: 12px; position: relative; }
  .tabs button svg { width: 21px; height: 21px; }
  .tabs .cnt { position: absolute; top: 2px; left: calc(50% + 6px); }
  .brand small { display: none; }
}
main { padding-block: 18px calc(56px + var(--nav-h)); }
.view[hidden] { display: none; }

/* przyciski, pola, chipy */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 999px; font-weight: 600; font-size: 14px; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--green); }
.btn.primary { background: var(--green); color: var(--green-ink); border-color: var(--green); }
.btn.small { padding: 5px 11px; font-size: 13px; }
.btn.ghost { background: none; }
.btn svg { width: 16px; height: 16px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.scroller { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; margin-inline: -2px; padding-inline: 2px; }
.scroller::-webkit-scrollbar { display: none; }
.chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 11px; font-size: 13px; font-weight: 500; white-space: nowrap; }
.chip svg { width: 14px; height: 14px; }
.chip[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: var(--green-ink); }
.chip .num { opacity: .7; font-size: 11px; }
.field { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 9px 14px; min-width: 0; }
.field input { border: 0; outline: 0; background: none; width: 100%; min-width: 0; }
.field:focus-within { border-color: var(--green); }
.field svg { width: 17px; height: 17px; color: var(--muted); }
select { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 12px; font-size: 14px; max-width: 100%; }
.lbl { font-size: 12px; color: var(--muted); font-weight: 500; }

/* przepisy */
.hero { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: end; justify-content: space-between; margin-bottom: 14px; }
.hero h2 { font-size: clamp(24px, 4vw, 32px); font-weight: 800; letter-spacing: -.025em; line-height: 1.05; }
.hero p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.toolbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; }
.filters { display: flex; flex-direction: column; gap: 8px; margin-block: 12px 14px; }
.count { font-size: 13px; color: var(--muted); margin: 0 0 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.count button { border: 0; background: none; color: var(--green); font-weight: 600; padding: 0; font-size: 13px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 14px; }
@media (max-width: 440px) { .grid { grid-template-columns: 1fr 1fr; gap: 10px; } }
.card { position: relative; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; cursor: pointer; transition: transform .15s, box-shadow .15s; }
.card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.card[hidden] { display: none; }
.ph { display: block; aspect-ratio: 1; width: 100%; max-width: 100%; object-fit: cover; background: var(--sunk); }
div.ph { display: grid; place-items: center; color: var(--muted); font-size: 12px; background-repeat: no-repeat; }
.card .body { padding: 9px 11px 11px; display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 0; }
.card .id { font-family: var(--f-num); font-size: 11px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.card .nm { border: 0; background: none; padding: 0; text-align: left; font-weight: 600; font-size: 14px; line-height: 1.3; }
.card .meta { margin-top: auto; display: flex; gap: 4px 9px; align-items: baseline; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.heart { position: absolute; top: 8px; right: 8px; width: 34px; height: 34px; border-radius: 99px; border: 0; display: grid; place-items: center; background: rgba(255, 255, 255, .88); color: #6b746d; box-shadow: 0 1px 3px rgba(0, 0, 0, .15); }
.heart svg { width: 18px; height: 18px; }
.heart[aria-pressed="true"] { color: #d23b5a; }
.play { position: absolute; top: 8px; left: 8px; z-index: 1; height: 34px; border-radius: 99px; display: inline-flex; align-items: center; gap: 5px; padding: 0 11px 0 9px; background: rgba(12, 18, 14, .72); color: #fff; font-size: 12px; font-weight: 600; text-decoration: none; box-shadow: 0 1px 3px rgba(0, 0, 0, .2); }
.play svg { width: 14px; height: 14px; fill: currentColor; }
.play:hover { background: rgba(12, 18, 14, .9); }
.thumb { position: relative; align-self: start; }
.thumb .play { top: auto; bottom: 6px; left: 6px; height: 28px; padding: 0 9px 0 7px; font-size: 11px; }
.btn.film { background: var(--ink); color: var(--bg); border-color: var(--ink); text-decoration: none; }
.btn.film svg { fill: currentColor; stroke: none; }
.heart[aria-pressed="true"] svg { fill: currentColor; }
.kcal { color: var(--tomato); font-family: var(--f-num); font-weight: 500; }
.tag { font-family: var(--f-body); font-size: 10.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; background: var(--green-soft); color: var(--green); white-space: nowrap; }
.tag.sug { background: var(--amber-soft); color: var(--amber); }
.tag.ban { background: var(--tomato-soft); color: var(--tomato); }
.tag.inplan { background: var(--green); color: var(--green-ink); }
.tag[hidden] { display: none; }
.empty { padding: 36px 0; text-align: center; color: var(--muted); }

/* plan */
.plan-head { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: end; justify-content: space-between; margin-bottom: 14px; }
.plan-head h2 { font-size: clamp(24px, 4vw, 32px); font-weight: 800; letter-spacing: -.025em; line-height: 1.05; }
.plan-head p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.plan-ctrl { display: flex; gap: 10px 14px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.plan-ctrl label { display: flex; align-items: center; gap: 6px; }
.plan-layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
@media (max-width: 900px) { .plan-layout { grid-template-columns: minmax(0, 1fr); } }
.week { display: flex; flex-direction: column; gap: 10px; }
/* tydzien: dzien = naglowek z podsumowaniem + kolumny posilkow */
.reroll { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: -4px 0 14px; }
.daybox { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px 12px; }
.daybox.today { border-color: var(--green); }
.dayhead { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; margin-bottom: 9px; }
.dayhead b { font-family: var(--f-display); font-weight: 800; font-size: 18px; color: var(--green); }
.dayhead .dt { font-family: var(--f-num); font-size: 12px; color: var(--muted); margin-left: 6px; }
.dayhead .sum { font-size: 12.5px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; margin-left: auto; }
.dayhead .sum b { font-family: var(--f-num); font-size: 12.5px; font-weight: 500; color: var(--ink); }
.meals { display: grid; grid-template-columns: repeat(var(--nm, 3), minmax(0, 1fr)); gap: 10px; }
.cell { position: relative; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--bg); min-width: 0; }
.cell.locked { border-color: var(--green); box-shadow: inset 0 3px 0 var(--green); }
.cell.rest { border-style: dashed; }
.cell.rest .cimg { filter: saturate(.35) opacity(.75); }
.cell.free { border-style: dashed; background: none; justify-content: center; align-items: flex-start; padding: 12px; gap: 8px; min-height: 120px; }
.cell .cimg { position: relative; overflow: hidden; aspect-ratio: 16 / 9; width: 100%; max-width: 100%; background: var(--sunk); cursor: pointer; }
.cell .cimg img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.cell .mk { position: absolute; top: 6px; left: 6px; font-size: 10.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; padding: 2px 7px; border-radius: 99px; background: rgba(12, 18, 14, .72); color: #fff; }
.cell.free .mk { position: static; background: var(--sunk); color: var(--muted); }
.cell .cb { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; }
.cell .title { background: none; border: 0; padding: 0; text-align: left; font-weight: 600; font-size: 14px; line-height: 1.3; }
.cell .title:hover { color: var(--green); text-decoration: underline; }
.cell .por { font-size: 12px; color: var(--muted); }
.cell .por b { font-family: var(--f-num); font-weight: 500; color: var(--ink); }
.cell .acts { display: flex; gap: 4px; margin-top: auto; padding-top: 4px; }
.ib { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; height: 30px; min-width: 30px; padding: 0 8px; display: inline-flex; align-items: center; justify-content: center; gap: 5px; font-size: 12px; font-weight: 600; }
.ib svg { width: 15px; height: 15px; }
.ib:hover { border-color: var(--green); }
.ib[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: var(--green-ink); }
.time { display: inline-flex; align-items: center; gap: 4px; font-family: var(--f-num); font-size: 12px; color: var(--amber); white-space: nowrap; }
.time svg { width: 13px; height: 13px; }
.time.long { color: var(--tomato); }
.when { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: var(--amber-soft); font-size: 13.5px; }
.when svg { width: 18px; height: 18px; color: var(--amber); }
.when b { font-family: var(--f-num); font-weight: 500; font-size: 16px; }
.when span { color: var(--muted); }
@media (max-width: 680px) {
  /* telefon: ustawienia tygodnia i losowanie w jednym przewijanym wierszu kazde */
  .plan-head p { font-size: 13px; }
  .plan-ctrl, .reroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding: 0 16px 2px; }
  .plan-ctrl::-webkit-scrollbar, .reroll::-webkit-scrollbar { display: none; }
  .plan-ctrl > *, .reroll > * { flex: none; white-space: nowrap; }
  .plan-ctrl { margin-bottom: 10px; }
  .plan-ctrl .chips { flex-wrap: nowrap; }
  .reroll { margin-top: 0; }
  .daybox { padding: 10px; }
  .dayhead { margin-bottom: 8px; }
  .dayhead .sum { margin-left: 0; width: 100%; gap: 10px; font-size: 12px; }
}
@media (max-width: 760px) {
  .meals { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .cell:not(.free) { display: grid; grid-template-columns: 84px minmax(0, 1fr); }
  .cell .cimg { aspect-ratio: auto; height: 100%; min-height: 84px; }
  .cell .mk { top: 4px; left: 4px; font-size: 9.5px; padding: 1px 5px; }
  .cell.free { min-height: 0; flex-direction: row; align-items: center; justify-content: space-between; }
}
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 16px; }
.panel h3 { font-size: 15px; font-weight: 600; font-family: var(--f-body); margin-bottom: 6px; }
.panel .lead { font-size: 12.5px; color: var(--muted); margin: 6px 0 0; }
.meter .big { font-family: var(--f-num); font-size: 36px; line-height: 1; color: var(--green); }
.bar { height: 8px; background: var(--sunk); border-radius: 99px; overflow: hidden; margin-top: 8px; }
.bar i { display: block; height: 100%; background: var(--green); border-radius: 99px; transition: width .3s; }
.mini { display: flex; flex-wrap: wrap; gap: 6px; }
.mini span { font-size: 12.5px; padding: 3px 9px; border-radius: 999px; background: var(--green-soft); }
.mini.left span { background: var(--amber-soft); }
.mini b { font-family: var(--f-num); font-weight: 500; font-size: 11.5px; color: var(--muted); margin-left: 4px; }
.settings { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.settings label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--muted); }
.settings input[type="number"] { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 7px 9px; font-family: var(--f-num); width: 100%; }
.settings .full { grid-column: 1 / -1; }
.check { display: flex !important; align-items: center; gap: 9px !important; font-size: 14px !important; color: var(--ink) !important; flex-direction: row !important; }
.check input { width: 18px; height: 18px; accent-color: var(--green); flex: none; }

/* zakupy */
.progress { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; font-size: 13.5px; color: var(--muted); }
.progress .bar { flex: 1; margin: 0; max-width: 360px; }
.shop { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; align-items: start; }
.sec { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 4px 14px 8px; min-width: 0; }
.sec h3 { font-family: var(--f-body); font-size: 11.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); padding: 10px 0 4px; display: flex; justify-content: space-between; }
.item { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 9px 0; border-top: 1px solid var(--line); cursor: pointer; }
.sec h3 + .item { border-top: 0; }
.item input { width: 19px; height: 19px; margin: 1px 0 0; accent-color: var(--green); }
.item .what { min-width: 0; font-weight: 500; }
.item .what span { display: block; font-size: 12px; color: var(--muted); font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .amt { text-align: right; font-family: var(--f-num); font-size: 13.5px; white-space: nowrap; }
.item .amt small { display: block; font-family: var(--f-body); font-size: 11.5px; color: var(--muted); }
.item.done .what, .item.done .amt { opacity: .45; text-decoration: line-through; }
details.pantry { margin-top: 20px; }
details.pantry summary { cursor: pointer; font-weight: 600; padding: 8px 0 12px; }

/* arkusze: karta przepisu, wybor dania, tryb gotowania */
.sheet { position: fixed; inset: 0; z-index: 20; background: var(--veil); display: flex; justify-content: center; align-items: flex-end; padding-top: max(20px, env(safe-area-inset-top, 0px)); }
.sheet[hidden] { display: none; }
.sheet .box { background: var(--bg); width: min(780px, 100%); max-height: 100%; overflow: auto; overscroll-behavior: contain; border-radius: 20px 20px 0 0; padding: 0 max(18px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); }
@media (min-width: 820px) { .sheet { align-items: center; padding: 32px; } .sheet .box { border-radius: 20px; max-height: calc(100vh - 64px); } }
.sbar { position: sticky; top: 0; z-index: 2; display: flex; gap: 8px; align-items: center; justify-content: flex-end; padding: 12px 0 10px; background: var(--bg); }
.sbar .grow { margin-right: auto; font-family: var(--f-num); font-size: 12px; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; min-width: 38px; height: 38px; display: inline-grid; place-items: center; padding: 0 10px; }
.iconbtn svg { width: 18px; height: 18px; }
.iconbtn[aria-pressed="true"].fav { color: #d23b5a; border-color: #d23b5a; }
.iconbtn[aria-pressed="true"].fav svg { fill: currentColor; }
.iconbtn[aria-pressed="true"].no { color: var(--tomato); border-color: var(--tomato); background: var(--tomato-soft); }
.pics { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 4px 0 14px; }
.pic { position: relative; aspect-ratio: 1; max-width: 100%; border-radius: 12px; overflow: hidden; background-color: var(--sunk); background-repeat: no-repeat; }
.pic img { display: block; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .25s; }
.pic img.ok { opacity: 1; }
.pics.one { grid-template-columns: 1fr; max-width: 380px; }

const ODM_KUP = { "doniczka": ["doniczka", "doniczki", "doniczek"], "bochenek": ["bochenek", "bochenki", "bochenków"] };
function sztukiTxt(n, et) { // "3 szt.", "2 pęczki", "1 główka", a dla opakowan z rozmiarem "2 × kubek 200 g"
  if (et === "sztuka" || et === "szt.") return n + " szt.";
  if (ODM[et]) return n + " " + pl(n, ODM[et][0], ODM[et][1], ODM[et][2]);
  if (ODM_KUP[et]) return n + " " + pl(n, ...ODM_KUP[et]);
  return n === 1 ? et : n + " × " + et;
}
// Lista zakupow mowi, co zdjac z polki: swieze i puszki w sztukach albo opakowaniach, drobnym
// drukiem ile naprawde potrzeba. Szafka (przyprawy, sypkie, oleje) zostaje w lyzkach i gramach.
function kupno(e) {
  const potrzeba = et => {
    const u = [...e.units];
    if (u.length === 1 && !WAGA.has(u[0])) return "potrzeba " + ilosc(e.q, u[0]);
    const plyn = u.every(x => x === "ml" || x === "l") || /\d\s*(ml|l)\b/.test(et || "");
    return "potrzeba ≈ " + (plyn ? fmt(e.g, "ml") + " ml" : fmt(e.g, "g") + " g");
  };
  if (!PANTRY.has(e.sec) && !/^(jajko|żółtko)$/.test(e.n)) {
    const pk = PACK[e.n] ? [PACK[e.n][0], PACK[e.n][1]] : KUPNO[e.n];
    if (pk && e.g > 0) {
      const [g, et] = pk, ile = PACK[e.n] && e.paczki ? e.paczki : Math.max(1, Math.ceil(e.g / g - .08));
      const glowne = sztukiTxt(ile, et), maly = e.n === "czosnek" ? "potrzeba ≈ " + ilosc(Math.max(1, Math.round(e.g / 5)), "ząbek") : potrzeba(et);
      return [glowne, maly === "potrzeba " + glowne ? "" : maly];
    }
  }
  const ile = ileKupic(e);
  // reszta spoza szafki w lyzkach albo garsciach: na wage, z oryginalna miara drobnym drukiem
  if (!PANTRY.has(e.sec) && /łyż|szklan|garś|ząb|szczypt/.test(ile) && e.g > 0) return ["≈ " + fmt(Math.max(e.g, 5), "g") + " g", "potrzeba " + ile];
  return [ile, ""];
}
function sekcje(tylkoNieodhaczone) {
  const m = potrzeby(S.plan || []); bilans(m);
  const sek = {};
  for (const e of m.values()) if (!tylkoNieodhaczone || !(PANTRY.has(e.sec) ? S.mam : S.kupione)[e.n]) (sek[e.sec] = sek[e.sec] || []).push(e);
  return { m, sek, kol: Object.keys(sek).sort((a, b) => SEC_ORDER.indexOf(a) - SEC_ORDER.indexOf(b)) };
}
function renderZakupy() {
  const { sek, kol } = sekcje(false);
  const pozycja = (e, spiz) => {
    const k = e.n, pk = PACK[k], done = !!(spiz ? S.mam : S.kupione)[k];
    const [ile, maly] = kupno(e);
    const do_ = [...e.ids].map(id => skrot(BY[id].n, 26)).join(" · ");
    return `<label class="item${done ? " done" : ""}"><input type="checkbox" data-${spiz ? "mam" : "kup"}="${esc(k)}" ${done ? "checked" : ""}>
      <span class="what">${esc(k)}<span>${esc(do_)}</span></span><span class="amt">${esc(ile)}${maly ? `<small>${esc(maly)}</small>` : ""}</span></label>`;
  };
  const blok = s => {
    const spiz = PANTRY.has(s), zb = spiz ? S.mam : S.kupione;
    const l = sek[s].sort((a, b) => (!!zb[a.n] - !!zb[b.n]) || a.n.localeCompare(b.n, "pl"));
    return `<div class="sec"><h3><span>${esc(s)}</span><span class="num">${l.filter(e => zb[e.n]).length}/${l.length}</span></h3>${l.map(e => pozycja(e, spiz)).join("")}</div>`;
  };
  const sw = kol.filter(s => !PANTRY.has(s)), sz = kol.filter(s => PANTRY.has(s));
  $("#shop").innerHTML = sw.map(blok).join("") || `<p class="empty">Plan jest pusty.</p>`;
  $("#pantry").innerHTML = sz.map(blok).join("");
  const nSw = sw.reduce((a, s) => a + sek[s].length, 0), nSz = sz.reduce((a, s) => a + sek[s].length, 0);
  const odh = sw.reduce((a, s) => a + sek[s].filter(e => S.kupione[e.n]).length, 0);
  const mam = sz.reduce((a, s) => a + sek[s].filter(e => S.mam[e.n]).length, 0);
  $("#pantry-sum").textContent = `W szafce: sprawdź, czy masz (${mam}/${nSz} odhaczone)`;
  const d0 = dzien(0), dk = dzien(S.ndni - 1);
  $("#shop-sub").textContent = `Na ${S.pos.map(m => POS[m].lm.toLowerCase()).join(", ")} ${d0.dt}–${dk.dt}: ${nSw} ${pl(nSw, "produkt", "produkty", "produktów")} świeżych i z puszek. Ilości z zapasem na całe opakowania.`;
  $("#progress").innerHTML = nSw ? `<span class="num">${odh}/${nSw}</span><div class="bar"><i style="width:${Math.round(odh / nSw * 100)}%"></i></div><span>${odh === nSw ? "Wszystko kupione" : "w koszyku"}</span>` : "";
  const n = nSw - odh; $("#shop-cnt").textContent = n ? String(n) : "";
}
function tekstListy() {
  const { sek, kol } = sekcje(true), d0 = dzien(0), dk = dzien(S.ndni - 1);
  return `Zakupy na tydzień ${d0.dt}–${dk.dt}\n\n` + kol.map(s =>
    (PANTRY.has(s) ? s + " (sprawdź w szafce)" : s).toUpperCase() + "\n" + sek[s].map(e => { const [ile, maly] = kupno(e); return "- " + e.n + ": " + ile + (maly ? ` (${maly})` : ""); }).join("\n")).join("\n\n");
}

/* ---------- zdarzenia ---------- */
let tt;
function toast(t, cofanie) {
  $("#toast-t").textContent = t; $("#toast-b").hidden = !(cofanie && HIST.length); $("#toast").hidden = false;
  clearTimeout(tt); tt = setTimeout(() => $("#toast").hidden = true, cofanie ? 5000 : 2400);
}
function pokaz(v) {
  if (!["przepisy", "plan", "zakupy"].includes(v)) v = "przepisy";
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.view === v));
  document.querySelectorAll(".view").forEach(s => s.hidden = s.id !== "v-" + v);
  if (v === "plan") renderPlan();
  if (v === "zakupy") renderZakupy();
  if (v === "przepisy") renderPrzepisy();
  try { history.replaceState(null, "", "#" + v); } catch (e) { }
  window.scrollTo(0, 0);
}
function przelaczUlub(id) {
  ULUB.has(id) ? ULUB.delete(id) : ULUB.add(id); zapiszZbiory();
  odswiezKarte(id); renderFiltry();
  if (!$("#sheet").hidden && D.id === id) renderKarta();
  if (F.ulub) renderPrzepisy();
  toast(ULUB.has(id) ? "Dodane do ulubionych." : "Usunięte z ulubionych.");
}
function przelaczBan(id) {
  BAN.has(id) ? BAN.delete(id) : BAN.add(id); zapiszZbiory(); odswiezKarte(id);
  if (!$("#sheet").hidden && D.id === id) renderKarta();
  if (!$("#v-plan").hidden) renderPlan();
  toast(BAN.has(id) ? "Nie będzie proponowane w planie." : "Znowu może trafić do planu.");
}
document.querySelector(".tabs").addEventListener("click", e => { const b = e.target.closest("[data-view]"); if (b) pokaz(b.dataset.view); });
$("#q").addEventListener("input", e => { F.q = e.target.value.trim(); renderPrzepisy(); });
$("#sort").addEventListener("change", e => { F.sort = e.target.value; renderPrzepisy(); });
$("#losuj").addEventListener("click", losuj);
$("#uloz").addEventListener("click", () => nowyPlan());
$("#cofnij").addEventListener("click", cofnij);
$("#toast-b").addEventListener("click", () => { $("#toast").hidden = true; cofnij(); });
$("#odznacz").addEventListener("click", () => { S.kupione = {}; S.mam = {}; zapisz(); renderZakupy(); });
$("#p-ndni").addEventListener("change", e => ustawDni(+e.target.value));
$("#p-max").addEventListener("change", e => { S.maxCzas = +e.target.value; zapisz(); renderPlan(); toast(S.maxCzas ? "Przy losowaniu dni robocze dostaną dania do " + czasTxt(S.maxCzas) + "." : "Bez limitu czasu."); });
$("#p-start").addEventListener("change", e => { S.start = e.target.value; zapisz(); renderPlan(); renderZakupy(); });
$("#kopiuj").addEventListener("click", () => {
  const t = tekstListy();
  let gotowe = false;
  const awaryjnie = () => {
    if (gotowe) return; gotowe = true;
    const ta = $("#copybuf"); ta.value = t; ta.select();
    try { toast(document.execCommand("copy") ? "Skopiowane." : "Nie udało się skopiować. Zaznacz listę ręcznie."); } catch (e) { toast("Nie udało się skopiować."); }
  };
  // niektore widoki nie odpowiadaja wcale - wtedy po 1,5 s probuje starym sposobem
  try { navigator.clipboard.writeText(t).then(() => { if (!gotowe) { gotowe = true; toast("Skopiowane. Wklej np. w Messengerze."); } }, awaryjnie); setTimeout(awaryjnie, 1500); } catch (e) { awaryjnie(); }
});
document.addEventListener("click", e => {
  const t = e.target; let b;
  if (t.closest("a[href]")) return; // link do filmu otwiera sie normalnie, bez karty pod spodem
  if ((b = t.closest("[data-ulub]"))) { e.stopPropagation(); przelaczUlub(b.dataset.ulub); }
  else if ((b = t.closest("[data-ban]"))) przelaczBan(b.dataset.ban);
  else if ((b = t.closest("[data-kat]"))) { F.kat = b.dataset.kat; renderFiltry(); renderPrzepisy(); }
  else if ((b = t.closest("[data-bialko]"))) { F.bialko = F.bialko === b.dataset.bialko ? null : b.dataset.bialko; renderFiltry(); renderPrzepisy(); }
  else if ((b = t.closest("[data-flag]"))) { F[b.dataset.flag] = !F[b.dataset.flag]; renderFiltry(); renderPrzepisy(); }
  else if ((b = t.closest("[data-czas]"))) { F.czas = F.czas === +b.dataset.czas ? 0 : +b.dataset.czas; renderFiltry(); renderPrzepisy(); }
  else if ((b = t.closest("[data-kcal]"))) { F.kcal = F.kcal === +b.dataset.kcal ? 0 : +b.dataset.kcal; renderFiltry(); renderPrzepisy(); }
  else if ((b = t.closest("[data-zr]"))) { F.zr = F.zr === b.dataset.zr ? "all" : b.dataset.zr; renderFiltry(); renderPrzepisy(); }
  else if (t.closest("#wyczysc")) { Object.assign(F, { q: "", kat: "Wszystkie", bialko: null, dwa: false, zr: "all", ulub: false, kcal: 0, czas: 0 }); $("#q").value = ""; renderFiltry(); renderPrzepisy(); }
  else if ((b = t.closest("[data-open]"))) otworz(b.dataset.open);
  else if ((b = t.closest(".card[data-id]"))) otworz(b.dataset.id);
  else if (t.closest("[data-close]") || t.id === "sheet") zamknij();
  else if ((b = t.closest("[data-por]"))) { const r = BY[D.id], k = +b.dataset.por; D.por = k === 0 ? r.p : Math.max(.5, D.por + k * (r.p >= 8 ? 1 : .5)); renderKarta(); }
  else if (t.closest("[data-losuj]")) losuj();
  else if (t.closest("[data-gotuj]")) gotuj();
  else if (t.closest("[data-cook-close]")) zamknijGotowanie();
  else if ((b = t.closest("[data-tick]"))) b.classList.toggle("done");
  else if ((b = t.closest("[data-wm]"))) { D.m = b.dataset.wm; renderKarta(); }
  else if ((b = t.closest("[data-wstaw]"))) { const d = +b.dataset.wstaw, id = D.id, m = D.m; zamknij(); pokaz("plan"); wstaw(id, d, m); }
  else if ((b = t.closest("[data-lock]"))) { const s = S.plan[+b.dataset.lock]; s.lock = !s.lock; zapisz(); renderPlan(); }
  else if ((b = t.closest("[data-zmien]"))) zmienSesje(+b.dataset.zmien);
  else if ((b = t.closest("[data-wybierz]"))) wybieracz(+b.dataset.wybierz, b.dataset.m);
  else if ((b = t.closest("[data-pick]"))) { const d = +b.dataset.dzien, m = b.dataset.m; zamknij(); wstaw(b.dataset.pick, d, m); }
  else if ((b = t.closest("[data-skat]"))) { const [m, k] = b.dataset.skat.split("|"), l = S.kat[m]; S.kat[m] = l.includes(k) ? l.filter(x => x !== k) : [...l, k]; if (!S.kat[m].length) S.kat[m] = [...POS[m].def]; zapisz(); renderPlan(); }
  else if ((b = t.closest("[data-pos]"))) przelaczPosilek(b.dataset.pos);
  else if ((b = t.closest("[data-reroll]"))) nowyPlan(b.dataset.reroll || undefined);
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.kup !== undefined || t.dataset.mam !== undefined) {
    const zb = t.dataset.kup !== undefined ? S.kupione : S.mam, k = t.dataset.kup ?? t.dataset.mam;
    if (t.checked) zb[k] = 1; else delete zb[k];
    zapisz(); renderZakupy();
  }
  if (t.id === "s-ty" || t.id === "s-ona") { S[t.id.slice(2)] = Math.max(1000, Math.min(6000, Math.round(+t.value || 0))); zapisz(); renderPlan(); }
  if (t.id === "s-pod") { S.podzial = Math.max(.3, Math.min(.8, (+t.value || 60) / 100)); zapisz(); renderPlan(); }
  if (t.id === "s-dwa") { S.dwa = t.checked; zapisz(); renderPlan(); toast(S.dwa ? "Przy następnym planie dania na 2 dni." : "Przy następnym planie każde danie na 1 dzień."); }
  if (t.id === "s-pref") { S.pref = t.checked; zapisz(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if (!$("#cook").hidden) zamknijGotowanie(); else if (!$("#sheet").hidden) zamknij(); }
  if (e.key === "Enter" && e.target.classList?.contains("card")) otworz(e.target.dataset.id);
});

// po aktualizacji danych w planie moze zostac przepis, ktorego juz nie ma albo nie ma skladnikow
function napraw() {
  if (S.plan) S.plan = S.plan.filter(s => BY[s.id] && doPlanu(BY[s.id]) && POS[s.m] && S.pos.includes(s.m) && s.dni.every(d => d < S.ndni));
  if (S.plan && !S.plan.length) S.plan = null;
  if (S.plan && S.pos.some(m => wolneDni(S.plan, m).length)) S.plan = dopelnij(S.plan); // dziury po usunietych daniach i nowe posilki
  // plan sprzed tygodnia: dni licza sie od dzis, dania zostaja
  if (dataDnia(S.ndni) <= dzis()) S.start = iso(dzis());
  for (const id of [...ULUB, ...BAN]) if (!BY[id]) { ULUB.delete(id); BAN.delete(id); }
}
/* ---------- start ---------- */
napraw();
zapiszZbiory();
const twoje = R.filter(r => !r.sug).length;
$("#brand-sub").textContent = `${R.length} przepisów · ${twoje} Twoich · ${R.length - twoje} moich sugestii`;
$("#hero-sub").textContent = `${R.length} przepisów ze zdjęciami. Szukaj po składniku, filtruj albo losuj.`;

// duze zdjecie w karcie przepisu pojawia sie na miniaturze, gdy sie zaladuje (load nie babelkuje - lapie w fazie przechwytywania)
